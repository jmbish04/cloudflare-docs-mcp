name = "cloudflare-docs-mcp"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Serve static files from the 'public' directory
[assets]
directory = "public"
binding = "ASSETS"

# Enable observability
[observability]
enabled = true

# Cron trigger
[triggers]
crons = ["0 0 * * *"]

# --- Durable Objects ---
[[durable_objects.bindings]]
name = "CHAT_SESSION_ACTOR"
class_name = "ChatSessionActor"

[[durable_objects.bindings]]
name = "CODE_INGESTION_ACTOR"
class_name = "CodeIngestionActor"

[[durable_objects.bindings]]
name = "FEASIBILITY_AGENT_ACTOR"
class_name = "FeasibilityAgentActor"

[[durable_objects.bindings]]
name = "SANDBOX"
class_name = "Sandbox"

# --- D1 Database ---
[[d1_databases]]
binding = "DB"
database_name = "cloudflare-docs-best-practices"
database_id = "233820bc-7d62-46e1-b215-311479ae372f"
migrations_dir = "migrations"

# --- Queues ---
[[queues.producers]]
queue = "code-ingestion-queue"
binding = "CODE_INGESTION_QUEUE"

[[queues.producers]]
queue = "feasibility-queue"
binding = "FEASIBILITY_QUEUE"

# --- KV Namespaces ---
[[kv_namespaces]]
binding = "AGENT_CACHE"
id = "f8746207fbb74862850104458ef12673"

# --- Workflows ---
[[workflows]]
name = "research-workflow"
binding = "RESEARCH_WORKFLOW"
class_name = "ResearchWorkflow"

# --- AI & Vectorize (Added based on src/env.ts) ---
[ai]
binding = "AI"

# wrangler vectorize create cloudflare-docs-mcp-index --preset @cf/baai/bge-large-en-v1.5
[[vectorize]]
binding = "VECTORIZE_INDEX"
index_name = "cloudflare-docs-mcp-index" # Ensure this matches your actual index name

# --- Environment Variables ---
[vars]
DEFAULT_MODEL_REASONING = "@cf/meta/llama-4-scout-17b-16e-instruct"
DEFAULT_MODEL_STRUCTURED_RESPONSE = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
DEFAULT_MODEL_EMBEDDING = "@cf/baai/bge-large-en-v1.5"
DEFAULT_MODEL_RERANKER = "@cf/baai/bge-reranker-base"

# --- Migrations ---
[[migrations]]
tag = "v1"
new_sqlite_classes = ["ChatSessionActor", "FeasibilityAgentActor"] # Removed stale ProductSyncActor

[[migrations]]
tag = "v2"
new_sqlite_classes = ["CodeIngestionActor"]
